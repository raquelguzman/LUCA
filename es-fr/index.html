<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>LUCA</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background-image: url('GITHUB1.png'); /* Dein Bild */
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      color: black;
      text-align: center;
      padding: 50px;
    }

    h1 {
      font-family: "SF Pro Display Black", "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 900; /* sehr fett */
      font-size: 72px;  /* nach Bedarf anpassen */
      margin-bottom: 20px
    }

    h2 {
      font-family: "SF Compact Text", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: bold;
      font-size: 28px;
      margin-bottom: 10px;
    }

    h3 {
      font-family: "SF Compact Text", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: normal;
      font-size: 20px;
      margin-bottom: 40px;
    }

    .subtitle {
      font-family: "SF Compact Text", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: bold;
      font-size: 22px;
      margin-bottom: 10px;
    }

    .subtext {
      font-size: 18px;
      margin-bottom: 30px;
    }

    audio {
      margin-top: 20px;
      width: 70%; /* Player schön breit machen */
      max-width: 500px;
    }
  </style>
</head>
<body>
  <h1>LUCA</h1>
  <h2>Un audiolibro multilingüe acompañado de un libro ilustrado.</h2>
  <h3>Maturaarbeit von Raquel Guzmán</h3>

<div class="subtitle"><b>Español</b> - <i style="font-weight: normal;">Francés</i></div>
  <div class="subtext">¡La aventura bilingüe puede comenzar!</div>

  <audio controls>
    <source src="probedeutschspanisch.mp3" type="audio/mpeg">
    Dein Browser unterstützt das Audio-Element nicht.
  </audio>
</body>
</html>
