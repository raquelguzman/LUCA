<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>LUCA</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background-image: url('GITHUB3.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      color: black;
      text-align: center;
      padding: 50px;
    }

    h1 {
      font-family: "SF Pro Display Black", "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 900;
      font-size: 72px;
      margin-bottom: 20px;
    }

    h2 {
      font-family: "SF Compact Text", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: bold;
      font-size: 28px;
      margin-bottom: 10px;
    }

    h3 {
      font-family: "SF Compact Text", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: normal;
      font-size: 20px;
      margin-bottom: 40px;
    }

    .subtitle {
      font-family: "SF Compact Text", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: bold;
      font-size: 22px;
      margin-bottom: 10px;
    }

    .subtext {
      font-size: 18px;
      margin-bottom: 30px;
    }

    /* AUDIO-CONTAINER */
    .audio-container {
      width: 500px;
      max-width: 100%;
      margin: 20px auto;
      background-color: rgb(128,162,190);
      border: 3px solid rgb(128,162,190);
      border-radius: 10px;
      padding: 10px;
      box-sizing: border-box;
    }

    /* Custom Audio Player */
    .custom-audio {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .custom-audio button.play-pause {
      background-color: #fff;
      border: none;
      border-radius: 5px;
      width: 50px;
      height: 50px;
      font-size: 22px;
      cursor: pointer;
    }

    .custom-audio .timeline {
      flex: 1;
      cursor: pointer;
      height: 8px;
      border-radius: 4px;
      background-color: #fff;
      -webkit-appearance: none;
    }

    .custom-audio .timeline::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      background: #444;
      border-radius: 50%;
      cursor: pointer;
    }

    .custom-audio .timeline::-moz-range-thumb {
      width: 15px;
      height: 15px;
      background: #444;
      border-radius: 50%;
      cursor: pointer;
    }

    .custom-audio .time {
      width: 50px;
      text-align: right;
      font-size: 14px;
    }

    .custom-audio audio {
      display: none; /* echtes Audio-Element verstecken */
    }

    /* Responsive: Handy / Tablet */
    @media (max-width: 480px) {
      .custom-audio button.play-pause {
        width: 40px;
        height: 40px;
        font-size: 18px;
      }

      .custom-audio .timeline {
        height: 6px;
      }

      .custom-audio .time {
        font-size: 12px;
        width: 40px;
      }
    }
  </style>
</head>
<body>
  <h1>LUCA</h1>
  <h2>Un audiolibro multilingüe acompañado de un libro ilustrado</h2>
  <h3>Maturaarbeit von Raquel Guzmán</h3>

  <div class="subtitle"><b>Español</b> - <i style="font-weight: normal;">Francés</i></div>
  <div class="subtext">¡La aventura bilingüe puede comenzar!</div>

  <!-- AUDIO-CONTAINER MIT CUSTOM PLAYER -->
  <div class="audio-container">
    <div class="custom-audio">
      <button class="play-pause">►</button>
      <input type="range" class="timeline" value="0" min="0" max="100">
      <span class="time">0:00</span>
      <audio src="ESPAÑOL Francés.mp3"></audio>
    </div>
  </div>

  <script>
    const container = document.querySelector('.custom-audio');
    const audio = container.querySelector('audio');
    const playBtn = container.querySelector('.play-pause');
    const timeline = container.querySelector('.timeline');
    const timeDisplay = container.querySelector('.time');

    playBtn.addEventListener('click', () => {
      if(audio.paused) { audio.play(); playBtn.textContent = '❚❚'; }
      else { audio.pause(); playBtn.textContent = '►'; }
    });

    audio.addEventListener('timeupdate', () => {
      const percent = (audio.currentTime / audio.duration) * 100;
      timeline.value = percent || 0;
      const minutes = Math.floor(audio.currentTime / 60);
      const seconds = Math.floor(audio.currentTime % 60).toString().padStart(2,'0');
      timeDisplay.textContent = `${minutes}:${seconds}`;
    });

    timeline.addEventListener('input', () => {
      audio.currentTime = (timeline.value / 100) * audio.duration;
    });
  </script>
</body>
</html>
