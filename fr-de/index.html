<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>LUCA</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background-image: url('GITHUB3.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      color: black;
      text-align: center;
      padding: 50px;
    }

    h1 {
      font-family: "SF Pro Display Black", "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 900;
      font-size: 72px;
      margin-bottom: 20px;
    }

    h2 {
      font-family: "SF Compact Text", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: bold;
      font-size: 28px;
      margin-bottom: 10px;
    }

    h3 {
      font-family: "SF Compact Text", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: normal;
      font-size: 20px;
      margin-bottom: 40px;
    }

    .subtitle {
      font-family: "SF Compact Text", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: bold;
      font-size: 22px;
      margin-bottom: 10px;
    }

    .subtext {
      font-size: 18px;
      margin-bottom: 30px;
    }

    /* NEUER AUDIO-CONTAINER */
    .audio-container {
      width: 500px;                     /* feste Breite der Box */
      max-width: 100%;                  /* passt sich an kleine Bildschirme an */
      margin: 20px auto;
      background-color: rgb(128,162,190); /* Box-Hintergrundfarbe */
      border: 3px solid rgb(128,162,190); /* Rand in der gleichen Farbe */
      border-radius: 10px;
      padding: 10px;
      box-sizing: border-box;
    }

    .audio-container audio {
      width: 100%;       /* Player füllt die Box komplett aus */
      height: 60px;      /* feste Höhe */
      border-radius: 10px;
      background-color: #fff; /* Player selbst weiß, Box außen Farbe */
    }
  </style>
</head>
<body>
  <h1>LUCA</h1>
  <h2>Ein mehrsprachiges Hörbuch begleitet von einem Bilderbuch</h2>
  <h3>Maturaarbeit von Raquel Guzmán</h3>

  <div class="subtitle"><b>Deutsch</b> - <i style="font-weight: normal;">Französisch</i></div>
  <div class="subtext">Das bilinguale Abenteuer kann beginnen!</div>

  <!-- NEUER AUDIO-CONTAINER -->
  <div class="audio-container">
    <audio controls>
      <source src="FRANÇAIS - Allemand" type="audio/mpeg">
      Dein Browser unterstützt das Audio-Element nicht.
    </audio>
  </div>
</body>
</html>
